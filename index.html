const KKM=75,CL=['XII-1','XII-2','XII-3','XII-4','XII-5','XII-6'],PW={'XII-1':'hijau21','XII-2':'hijau22','XII-3':'hijau23','XII-4':'hijau24','XII-5':'hijau25','XII-6':'hijau26'};

const MAT=[
['Pengertian Peradaban Islam','Peradaban (<i>ḥaḍārah/tamaddun</i>) adalah hasil budi daya manusia berupa ilmu, teknologi, seni, hukum, dan tata masyarakat yang maju. Peradaban Islam berpijak pada wahyu pertama "Iqra\'" (QS. al-\'Alaq: 1–5) yang mendorong membaca, menulis, dan meneliti, serta QS. ar-Raḥmān: 33 yang mendorong manusia menjelajah dengan ilmu dan teknologi (<i>sulṭān</i>).'],
['Periode Klasik (650–1250 M)','<b>Khulafaur Rasyidin (632–661):</b> Abu Bakar, Umar, Utsman, Ali; pengumpulan Al-Qur\'an, perluasan wilayah, tata pemerintahan (diwan). <b>Bani Umayyah (661–750, Damaskus):</b> pendiri Mu\'awiyah bin Abi Sufyan; ekspansi hingga Andalusia (711, Thariq bin Ziyad); Abdul Malik bin Marwan mencetak dinar dan mengarabkan administrasi. <b>Bani Abbasiyah (750–1258, Baghdad):</b> pendiri Abul Abbas as-Saffah; puncak kejayaan masa Harun ar-Rasyid dan al-Ma\'mun; berdiri <i>Baitul Hikmah</i> sebagai pusat penerjemahan dan riset. <b>Dinasti lain:</b> Umayyah Andalusia (756, Abdurrahman ad-Dakhil, Cordoba) dan Fatimiyah (Mesir, Universitas al-Azhar 972).'],
['Periode Pertengahan (1250–1800 M)','Masa kemunduran politik: Baghdad dihancurkan pasukan Mongol di bawah Hulagu Khan (1258). Lahir tiga kerajaan besar: <b>Turki Usmani</b> (Istanbul; Muhammad al-Fatih menaklukkan Konstantinopel 1453), <b>Safawi</b> di Persia (Isfahan, Syah Abbas I), dan <b>Mughal</b> di India (Akbar, Syah Jahan pembangun Taj Mahal). Ilmu, arsitektur, dan seni tetap berkembang.'],
['Periode Modern (1800–sekarang)','Dimulai dengan kedatangan Napoleon ke Mesir (1798) yang menyadarkan umat akan ketertinggalan. Muncul gerakan pembaruan: Muhammad Ali Pasha (Mesir), Jamaluddin al-Afghani, Muhammad Abduh, Muhammad Iqbal, dan Sayyid Ahmad Khan. Khilafah Usmani berakhir 1924; negara-negara Muslim merdeka dan membangun pendidikan, ekonomi, serta ilmu pengetahuan.'],
['Ilmuwan Muslim dan Kontribusinya','<b>Ibnu Sina</b>: <i>al-Qānūn fī aṭ-Ṭibb</i> (kedokteran). <b>al-Khawarizmi</b>: aljabar dan algoritma. <b>ar-Razi</b>: membedakan campak dan cacar. <b>Ibnu Haitsam</b>: optik, <i>Kitāb al-Manāẓir</i>. <b>az-Zahrawi</b>: bedah, <i>at-Taṣrīf</i>. <b>Ibnu Rusyd</b>: filsafat dan fikih, <i>Bidāyatul Mujtahid</i>. <b>al-Ghazali</b>: <i>Iḥyā\' \'Ulūmiddīn</i>. <b>Ibnu Khaldun</b>: sosiologi dan sejarah, <i>al-Muqaddimah</i>.'],
['Faktor Kemajuan & Kemunduran','<b>Kemajuan:</b> semangat wahyu dan ilmu, dukungan penguasa, penerjemahan, kebebasan berpikir, perpustakaan dan lembaga pendidikan, serta stabilitas ekonomi. <b>Kemunduran:</b> konflik internal dan perebutan kekuasaan, taklid dan menurunnya ijtihad, serangan Mongol dan Perang Salib, korupsi, serta tertinggal dalam sains dan teknologi.'],
['Pengaruh bagi Dunia dan Teladan','Karya ilmuwan Muslim diterjemahkan ke bahasa Latin dan memengaruhi Renaisans Eropa. Teladan bagi kita: mencintai ilmu, jujur meneliti, terbuka pada perbedaan, bekerja sama, dan memanfaatkan sains untuk kemaslahatan.']];
const SUM=['Peradaban Islam berpijak pada wahyu "Iqra\'" dan semangat ilmu.','Klasik (650–1250): Khulafaur Rasyidin, Umayyah (Damaskus), Abbasiyah (Baghdad, Baitul Hikmah).','Pertengahan (1250–1800): Baghdad jatuh 1258; Usmani, Safawi, Mughal.','Modern (1800–kini): pembaruan oleh al-Afghani, Abduh, Iqbal; Usmani berakhir 1924.','Ilmuwan: Ibnu Sina, al-Khawarizmi, ar-Razi, Ibnu Haitsam, az-Zahrawi, Ibnu Rusyd, al-Ghazali, Ibnu Khaldun.','Kemajuan karena ilmu, dukungan penguasa, penerjemahan; kemunduran karena konflik, taklid, serangan luar.'];
const PRJ=[['Proyek 1: Peta Linimasa Peradaban Islam','Buat linimasa digital/poster dari masa Rasulullah hingga modern berisi tokoh, pusat peradaban, dan capaian ilmu. Presentasikan 3 menit.'],['Proyek 2: Profil Ilmuwan Muslim dan Penerapannya Kini','Pilih satu ilmuwan, buat infografis/video 2–3 menit tentang karyanya dan relevansinya dengan sains modern.'],['Proyek 3: Kampanye "Budaya Literasi dan Riset di Sekolah"','Rancang dan jalankan program literasi (pojok baca, mini riset kelas) yang terinspirasi Baitul Hikmah; tulis laporan dan refleksi.']];

const LAT=[["Wahyu pertama yang menjadi dasar peradaban Islam…","QS. al-'Alaq: 1–5","QS. al-Fatihah","QS. al-Ikhlas","QS. al-Baqarah: 1","QS. an-Nas",3],["Khalifah Abbasiyah yang dikenal puncak kejayaan dan pendiri Baitul Hikmah (pengembang)…","Al-Ma'mun","Mu'awiyah","Abu Bakar","Umar II","Abdul Malik",1],["Periode klasik Islam berlangsung…","650–1250 M","1250–1800 M","1800–kini","500–600 M","1900–2000 M",4],["Ibu kota Umayyah Andalusia…","Cordoba","Damaskus","Baghdad","Kairo","Isfahan",0],["Ilmuwan yang membedakan campak dan cacar…","Ar-Razi","Ibnu Rusyd","Al-Biruni","Ibnu Khaldun","Al-Ghazali",2],["Pengarang Ihya Ulumuddin…","Al-Ghazali","Ibnu Sina","Ibnu Rusyd","Al-Farabi","Ibnu Haitsam",4],["Dinasti yang mendirikan Universitas al-Azhar…","Fatimiyah","Abbasiyah","Umayyah","Mughal","Safawi",2],["Kerajaan Islam dengan ibu kota Isfahan…","Safawi","Mughal","Usmani","Ayyubi","Mamluk",0],["Kedatangan Napoleon ke Mesir (1798) menandai…","Awal periode modern","Akhir periode klasik","Berdirinya Abbasiyah","Jatuhnya Andalusia","Perang Salib",3],["Ibnu Haitsam dikenal dalam bidang…","Optik","Astronomi saja","Hukum","Sastra","Pertanian",0]];
const EVA=[["Penerjemahan di Baitul Hikmah berdampak jangka panjang karena…","Menjadi jembatan transfer ilmu Yunani-Persia-India ke Eropa dan memicu riset orisinal","Menghentikan riset lokal","Hanya menyalin tanpa analisis","Mengganti bahasa Arab","Memusatkan ilmu pada istana",4],["Analisis tepat tentang runtuhnya Baghdad 1258…","Gabungan lemahnya politik internal dan serangan Mongol","Semata karena bencana alam","Karena terlalu banyak riset","Karena kekayaan berlimpah","Karena penolakan pemerintahan",2],["Mengapa tiga kerajaan besar tetap maju meski periode pertengahan disebut kemunduran?","Ilmu, arsitektur, dan militer berkembang di pusat kekuasaan baru, walau persatuan umat melemah","Tidak ada kemajuan sama sekali","Semua wilayah bersatu","Eropa belum berkembang","Mongol membantu mereka",0],["Relevansi QS. ar-Rahman: 33 dengan teknologi modern…","Menegaskan dorongan Islam menguasai sains-teknologi (sulthan) secara bertanggung jawab","Melarang eksplorasi luar angkasa","Hanya berlaku bagi jin","Tidak ada hubungan","Mewajibkan menghindari teknologi",3],["Ibnu Khaldun dianggap bapak sosiologi karena…","Menganalisis pasang surut peradaban dengan konsep ashabiyah dalam al-Muqaddimah","Menemukan aljabar","Menulis kitab fikih","Mengobati penyakit","Menyusun peta dunia",1],["Kritik terhadap sikap taklid dalam kemunduran peradaban…","Melemahkan ijtihad dan inovasi","Meningkatkan riset","Mempercepat penerjemahan","Mendorong kebebasan ilmiah","Memperkuat sains",2],["Strategi terbaik umat Islam masa kini untuk bangkit…","Menguatkan literasi, riset, etika, dan persatuan","Menutup diri dari dunia","Mengandalkan kejayaan masa lalu","Menolak teknologi","Fokus pada simbol saja",4],["Perbedaan utama pembaruan Abduh dan Iqbal dengan masa Abbasiyah…","Abduh dan Iqbal merespons tantangan kolonialisme dan modernitas Barat, sedangkan Abbasiyah berada pada masa ekspansi dan kejayaan","Keduanya hidup pada masa Abbasiyah","Keduanya menolak ilmu","Abbasiyah masa kolonial","Tidak ada perbedaan",1],["Dampak penaklukan Konstantinopel 1453 bagi dunia…","Mengubah jalur perdagangan dan menandai berakhirnya Bizantium","Berakhirnya Abbasiyah","Awal Perang Salib","Berdirinya Mughal","Hancurnya Baghdad",3],["Sikap ilmiah yang paling mencerminkan warisan ilmuwan Muslim…","Jujur meneliti, terbuka kritik, dan bermanfaat bagi manusia","Meniru tanpa sumber","Menyembunyikan temuan","Mengutamakan popularitas","Menolak perbedaan pendapat",0]];
const TP=["Menjelaskan pengertian peradaban Islam dan dasarnya dalam Al-Qur'an (QS. al-'Alaq: 1–5; QS. ar-Raḥmān: 33).", "Menganalisis perkembangan peradaban Islam pada periode klasik, pertengahan, dan modern.", "Mengidentifikasi tokoh ilmuwan Muslim beserta kontribusinya bagi dunia.", "Menganalisis faktor kemajuan dan kemunduran peradaban Islam.", "Meneladani semangat ilmu dan menerapkannya dalam proyek serta kehidupan sehari-hari."];
const tp=()=>`<div class="card"><h3>🎯 Tujuan Pembelajaran</h3><p>Setelah mempelajari bab ini, peserta didik mampu:</p><ol>${TP.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;
let U=null,P={},cur=0,tmr=null;
const $=id=>document.getElementById(id),key=()=>'pai12b5_'+U.n.toLowerCase()+'_'+U.c;
const save=()=>{try{localStorage.setItem(key(),JSON.stringify(P))}catch(e){}};
const load=()=>{try{P=JSON.parse(localStorage.getItem(key()))||{}}catch(e){P={}}P.k=P.k||[];P.d=P.d||{}};
const kuisDone=()=>[0,1,2,3,4].every(i=>(P.k[i]||0)>=KKM);
const unlocked=i=>i==7||i==0||(i==1&&P.d[0])||(i==2&&P.d[1])||(i==3&&P.d[2])||(i==4&&P.d[3])||(i==5&&kuisDone())||(i==6&&kuisDone()&&P.d[5]);
function opts(q){const a=q.slice(2,6);a.splice(q[6],0,q[1]);return a}
function nav(){$('nav').innerHTML=SEC.map((s,i)=>`<button class="${i==cur?'on':''}" ${unlocked(i)?'':'disabled'} onclick="go(${i})">${unlocked(i)?'':'🔒 '}${s}</button>`).join('')+'<button onclick="location.reload()">Keluar</button>'}
function go(i){clearInterval(tmr);$('tm').style.display='none';cur=i;nav();[tad,mat,rin,pro,kuisMenu,()=>quiz('lat',LAT,0,'Latihan Soal'),()=>quiz('ev',EVA,15,'Soal Evaluasi (Sulit & Sangat Sulit)'),rekap][i]();scrollTo(0,0)}
function login(){$('nav').innerHTML='';$('m').innerHTML=`<div class="card"><h2>Masuk</h2><label>Nama Lengkap</label><input id="n"><label>Kelas</label><select id="c">${CL.map(c=>`<option>${c}</option>`).join('')}</select><label>Password kelas</label><input id="p" type="password"><button class="btn" onclick="doLogin()">Masuk</button><p id="er" class="no"></p></div>`}
function doLogin(){const n=$('n').value.trim(),c=$('c').value;if(!n)return $('er').textContent='Nama lengkap wajib diisi.';if($('p').value!==PW[c])return $('er').textContent='Password kelas salah.';U={n,c};load();go(0)}
function done(i,next){P.d[i]=1;save();go(next)}
function tad(){$('m').innerHTML=tp()+`<div class="card"><h2>📖 Tadarus</h2><p>Bacalah dengan tartil; perhatikan tanda waqaf (ۖ boleh berhenti/lanjut, ۚ lebih baik lanjut, ۗ lebih baik berhenti).</p><h3>QS. al-'Alaq: 1–5</h3><div class="ar">${AR1}</div><p><i>Artinya:</i> "Bacalah dengan (menyebut) nama Tuhanmu yang menciptakan. Dia menciptakan manusia dari segumpal darah. Bacalah, dan Tuhanmulah Yang Mahamulia, yang mengajar (manusia) dengan pena. Dia mengajarkan manusia apa yang tidak diketahuinya."</p><h3>QS. ar-Raḥmān: 33</h3><div class="ar">${AR2}</div><p><i>Artinya:</i> "Wahai golongan jin dan manusia! Jika kamu sanggup menembus penjuru langit dan bumi, maka tembuslah. Kamu tidak akan mampu menembusnya kecuali dengan kekuatan (ilmu dan teknologi)."</p><button class="btn" onclick="done(0,1)">✔ Selesai Tadarus → Materi</button></div>`}
function mat(){$('m').innerHTML=tp()+`<h2>📚 Materi Pembelajaran</h2>`+MAT.map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')+`<button class="btn" onclick="done(1,2)">✔ Selesai Membaca → Ringkasan</button>`}
function rin(){$('m').innerHTML=`<div class="card"><h2>📝 Ringkasan Materi</h2><ul>${SUM.map(s=>`<li>${s}</li>`).join('')}</ul><button class="btn" onclick="done(2,3)">✔ Lanjut → Proyek</button></div>`}
function pro(){$('m').innerHTML=`<h2>🛠 Proyek (pilih salah satu atau kerjakan semuanya)</h2>`+PRJ.map(p=>`<div class="card"><h3>${p[0]}</h3><p>${p[1]}</p></div>`).join('')+`<button class="btn" onclick="done(3,4)">✔ Lanjut → Kuis</button>`}
function kuisMenu(){$('m').innerHTML=`<div class="card"><h2>🎯 Kuis 5 Level</h2><p>Setiap level 3 soal, waktu 5 menit, KKM ${KKM}. Level berikutnya terbuka jika level sebelumnya lulus.</p>`+[0,1,2,3,4].map(i=>{const s=P.k[i],ok=i==0||(P.k[i-1]||0)>=KKM;return `<p>Level ${i+1}: <b>${s==null?'belum':s}</b> ${s>=KKM?'✅':''} <button class="btn" ${ok?'':'disabled'} onclick="quiz('k${i}',KUIS[${i}],5,'Kuis Level ${i+1}')">${ok?'Mulai':'🔒'}</button></p>`}).join('')+(kuisDone()?'<p class="ok">Semua level lulus! Lanjut ke Latihan.</p><button class="btn" onclick="go(5)">Latihan →</button>':'')+'</div>'}
function quiz(id,Q,min,title){let t=min*60;const ps=Q.map(opts);$('m').innerHTML=`<div class="card"><h2>${title}</h2>`+Q.map((q,i)=>`<div class="q"><b>${i+1}. ${q[0]}</b>`+ps[i].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}" style="width:auto;margin:0 8px 0 0"> ${'ABCDE'[j]}. ${o}</label>`).join('')+'</div>').join('')+`<button class="btn" onclick="fin()">Kumpulkan</button></div>`;
window.fin=function(){clearInterval(tmr);$('tm').style.display='none';let r=0,h='';Q.forEach((q,i)=>{const v=document.querySelector(`input[name=q${i}]:checked`),c=q[6];if(v&&+v.value==c)r++;h+=`<p>${i+1}. ${v&&+v.value==c?'<span class=ok>Benar</span>':'<span class=no>Salah</span>'} — Jawaban: ${'ABCDE'[c]}. ${ps[i][c]}</p>`});const s=Math.round(r/Q.length*100);
if(id[0]=='k')P.k[+id[1]]=Math.max(P.k[+id[1]]||0,s);else if(id=='lat'){P.l=s;P.d[5]=1}else P.e=Math.max(P.e||0,s);save();
